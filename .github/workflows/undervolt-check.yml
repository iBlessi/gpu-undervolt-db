name: Undervolt dataset check

# git is the moderation queue: this runs the outlier check on any PR that touches the
# crowdsourced undervolt dataset. It BLOCKS on hard violations (schema / typos / impossible
# values / missing source) and WARNS on statistical outliers (which still merge and are held
# out of the on-site table by the shortcode until a maintainer confirms them). No backend.

on:
  pull_request:
    paths:
      - "data/undervolt_results.json"
      - "scripts/undervolt_outlier_flag.py"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  outlier-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prove the checker itself works (self-test)
        run: python3 scripts/undervolt_outlier_flag.py --self-test
      - name: Validate submitted rows
        run: python3 scripts/undervolt_outlier_flag.py --check
